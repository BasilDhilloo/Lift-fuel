<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#137A57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Lift &amp; Fuel"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Lift & Fuel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column. Big "left today" numbers on top, quick actions next, log below. Three tabs fixed at the bottom; rest timer docks above them. */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --ink:#111518; --muted:#5E6A73; --line:#DDE2E6; --soft:#E8ECEF;
  --accent:#137A57; --accent-ink:#FFFFFF; --pro:#2E62C9; --warn:#A5630B; --bad:#B53A33;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#171D21; --ink:#EAEFF2; --muted:#94A1AA; --line:#283239; --soft:#20282E;
  --accent:#3DCB96; --accent-ink:#052219; --pro:#7DA8FF; --warn:#E5B04C; --bad:#F2877F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#171D21; --ink:#EAEFF2; --muted:#94A1AA; --line:#283239; --soft:#20282E;
  --accent:#3DCB96; --accent-ink:#052219; --pro:#7DA8FF; --warn:#E5B04C; --bad:#F2877F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:8px}
.dnav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.dnav .d{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;flex:none;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
h2{font:700 14px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:grid;gap:10px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted)} .sm{font-size:13px} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn.danger{color:var(--bad)}
input[type=number],input[type=text],input[type=search],textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.big .v{font:700 44px/1 var(--display);letter-spacing:.01em}
.big .l{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.big.over .v{color:var(--warn)}
.sub{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* quick add */
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa button{min-height:64px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:2px;align-content:center}
.qa b{font-weight:600;font-size:15px;line-height:1.2}
.qa span{font-size:12px;color:var(--muted)}
.qa button:active{background:var(--soft)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* log */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .n{font-weight:500;overflow-wrap:anywhere}
.li .m{font-size:12px;color:var(--muted)}
.li .k{font-weight:700;text-align:right}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--soft);font-size:18px;line-height:1;color:var(--muted)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stp button{width:36px;height:40px;border:0;background:none;font-size:20px;line-height:1}
.stp input{width:56px;min-height:40px;border:0;border-inline:1px solid var(--line);border-radius:0;text-align:center;padding:0 2px;font-weight:600}
.stp.s input{width:40px}
.empty{padding:18px 6px;text-align:center;color:var(--muted);font-size:14px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh b{font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.sheet .sb{overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));flex:1}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .n{font-weight:500;overflow-wrap:anywhere}
.star{width:36px;height:36px;border:0;background:none;font-size:20px;color:var(--muted)}
.star[aria-pressed=true]{color:var(--warn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}

/* workout */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.today::after{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--accent);margin-left:6px;vertical-align:middle}
.ex{display:grid;gap:10px}
.ex h3{margin:0;font:700 20px/1.15 var(--display);letter-spacing:.02em}
.ex .t{font-weight:600;color:var(--accent);font-size:14px}
.ex .why{font-size:13px;color:var(--muted)}
.ex.alldone{border-color:var(--accent)}
.set{display:grid;grid-template-columns:14px 130px 114px 1fr;gap:6px;align-items:center}
.set .sn{font-size:13px;color:var(--muted);font-weight:600}
.ck{justify-self:end;width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ck svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:3}
.ck[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.ck[aria-pressed=true] svg{stroke:var(--accent-ink)}
.set.done input{color:var(--muted)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;border-left:3px solid var(--accent);background:var(--soft);padding:8px 12px;border-radius:0 10px 10px 0}
.note.w{border-color:var(--warn)}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile .v{font:700 30px/1.05 var(--display)}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font:500 10px var(--body);fill:var(--muted)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:10px;border-top:1px solid var(--line)}
.lift:first-child{border-top:0}

/* tabs + timer + toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{min-height:60px;border:0;background:none;display:grid;place-items:center;gap:2px;color:var(--muted);font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;padding-top:6px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-current=page]{color:var(--accent)}
#timer{position:fixed;left:0;right:0;z-index:11;bottom:calc(61px + env(safe-area-inset-bottom,0px));padding-inline:16px}
#timer .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
#timer .tv{font:700 28px/1 var(--display);min-width:64px}
#timer .tl{flex:1;font-size:13px;opacity:.8}
#timer button{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid currentColor;background:none;color:inherit;font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 8px 10px 16px;border-radius:12px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
#toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast button{color:var(--accent-ink)}}
@media (max-width:360px){.big .v{font-size:36px}.set{grid-template-columns:0 124px 110px 1fr;gap:6px}.set .sn{visibility:hidden}}
@media (prefers-reduced-motion:no-preference){.bar i,.prog i{transition:width .3s}}
</style>

/* progression: hit top of range on every set -> add weight; missed bottom twice at same weight -> drop 10% */
function target(ex,d){
  var h=hist(ex.id,d),n=ex.sets;
  if(!h.length)return {w:'',r:ex.lo,why:'First time: pick a weight you could do for '+(ex.hi+2)+(ex.unit==='sec'?' seconds':' reps')+'. Stop with 2 left in the tank.'};
  var L=h[0],w=Math.max.apply(null,L.map(function(s){return +s.w||0}));
  var allTop=L.length>=n&&L.every(function(s){return +s.r>=ex.hi});
  var missed=function(x){return x.some(function(s){return +s.r<ex.lo})};
  var lastTxt=L.map(function(s){return ex.noload?s.r+'s':(+s.w||0)+'×'+s.r}).join(', ');
  if(ex.noload){var bestR=Math.max.apply(null,L.map(function(s){return +s.r||0}));return {w:'',r:allTop?ex.hi+5:Math.min(ex.hi,bestR+5),why:'Last: '+lastTxt+'. '+(allTop?'Hold 5 seconds longer.':'Add 5 seconds.'),up:allTop}}
  if(allTop)return {w:w+ex.inc,r:ex.lo,why:'Last: '+lastTxt+'. You hit '+ex.hi+' on every set, so add '+ex.inc+' lb.',up:true};
  if(h[1]&&missed(L)&&missed(h[1])){var dw=Math.max(0,Math.round(w*0.9/5)*5);return {w:dw,r:ex.lo,why:'Last: '+lastTxt+'. Two tough sessions in a row, so drop to '+dw+' lb and build back up.',down:true}}

  return {w:w,r:Math.min(ex.hi,Math.max(ex.lo,bestR2+1)),why:'Last: '+lastTxt+'. Same weight, try one more rep.'};
}

function kcalChart(){
  var t=today(),days=[],T=S.targets.kcal;for(var i=13;i>=0;i--)days.push(addDays(t,-i));
  var vals=days.map(function(d){return tot(d).kcal}),max=Math.max(T*1.3,Math.max.apply(null,vals)*1.05);

  });

function weightChart(ws){

  var lo=Math.floor(mn),hi=Math.ceil(mx),W=340,H=140,L=34,R=W-10,T=12,B=112;
  var t0=parse(ws[0]).getTime(),t1=parse(ws[ws.length-1]).getTime(),span=Math.max(1,t1-t0);
  function X_(k){return L+(parse(k).getTime()-t0)/span*(R-L)} function Y_(w){return B-(w-lo)/(hi-lo)*(B-T)}

  var out='';
  [lo,(lo+hi)/2,hi].forEach(function(g){var y=Y_(g).toFixed(1);out+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(+y+3)+'" text-anchor="end">'+(Math.round(g*10)/10)+'</text>'});
  out+='<polyline points="'+L+','+B+' '+pts+' '+R+','+B+'" fill="var(--soft)" stroke="none" opacity=".7"/>';
  out+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  ws.forEach(function(k,i){out+='<circle cx="'+X_(k).toFixed(1)+'" cy="'+Y_(v[i]).toFixed(1)+'" r="'+(i===ws.length-1?4.5:2.5)+'" fill="var(--accent)"/>'});
  var f=function(k){return parse(k).toLocaleDateString('en-CA',{month:'short',day:'numeric'})};
  out+='<text x="'+L+'" y="130">'+f(ws[0])+'</text><text x="'+R+'" y="130" text-anchor="end">'+f(ws[ws.length-1])+'</text>';
  var ch=v[v.length-1]-v[0],days=Math.max(1,(t1-t0)/864e5),perWk=ch/days*7;

}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  var a=el.dataset.a,id=el.dataset.id;
  switch(a){
  case 'tab':tab=el.dataset.t;pickDay=null;render();window.scrollTo(0,0);break;
  case 'day':date=addDays(date,+el.dataset.n);if(date>today())date=today();pickDay=null;render();break;
  case 'gotoday':date=today();pickDay=null;render();break;
  case 'settings':armed=false;openSettings();break;
  case 'close':$('#sheet').hidden=true;render();break;
  case 'quick':var f=food(id);if(f){addFood(f,1);render()}break;
  case 'search':openSearch();break;
  case 'manual':openManual();break;
  case 'sadd':var f2=food(id);if(f2){addFood(f2,1);fillSearch()}break;
  case 'fav':var i=S.favs.indexOf(id);if(i>-1)S.favs.splice(i,1);else S.favs.push(id);save();fillSearch();break;
  case 'msave':
    var nm=($('#m-name').value||'').trim()||'Quick entry',k=nv('m-kcal');
    if(!k){toast('Enter the calories');return}
    var nf_={id:'c'+Date.now().toString(36),name:nm,serving:'1 serving',kcal:k,p:nv('m-p'),c:nv('m-c'),f:nv('m-f')};
    if($('#m-save').checked&&nm!=='Quick entry'){S.custom.unshift(nf_);if(S.favs.indexOf(nf_.id)<0)S.favs.push(nf_.id)}
    addFood(nf_,1);$('#sheet').hidden=true;render();break;
  case 'estadd':
    var ek=nv('estk'),ep=nv('estp'),et=(estText||'').trim();
    if(!ek){toast(et?'Enter the calories':'Type what you ate first');return}
    var rest=Math.max(0,ek-ep*4),nm2=et?et.charAt(0).toUpperCase()+et.slice(1):'Quick entry';
    addFood({id:'est',name:nm2.length>60?nm2.slice(0,57)+'...':nm2,serving:'estimate',kcal:ek,p:ep,c:r0(rest*0.55/4),f:r0(rest*0.45/9)},1);
    S.recent=S.recent.filter(function(x){return x!=='est'});save();
    estText='';estTouched=false;render();break;
  case 'qty':var e=log(date).filter(function(x){return x.id===id})[0];if(e){e.qty=Math.max(0.5,e.qty+ +el.dataset.d);save();render()}break;
  case 'del':var L=log(date),idx=-1,rm;L.forEach(function(x,j){if(x.id===id)idx=j});if(idx>-1){rm=L.splice(idx,1)[0];save();render();var dd=date;toast('Removed '+rm.name,function(){(S.log[dd]=S.log[dd]||[]).push(rm);save();render()})}break;
  case 'copyday':var y=log(addDays(date,-1)).filter(function(x){return !x.ex});S.log[date]=y.map(function(x){var c=JSON.parse(JSON.stringify(x));c.id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);return c});save();render();toast('Copied '+y.length+' items from yesterday');break;
  case 'clearex':Object.keys(S.log).forEach(function(d){S.log[d]=S.log[d].filter(function(x){return !x.ex});if(!S.log[d].length)delete S.log[d]});delete S.example;save();render();break;
  case 'clearw':S.weights={};delete S.exampleWeights;save();render();break;
  case 'pickday':
    var cur=S.wo[date];
    if(cur&&Object.keys(cur.sets||{}).length&&cur.day!==el.dataset.d){toast('This day already has sets logged for '+cur.day);return}
    if(cur)cur.day=el.dataset.d;pickDay=el.dataset.d;save();render();break;
  case 'warm':case 'fin':var sw=S.wo[date]||(S.wo[date]=wsess(date,pickDay));sw[a]=!sw[a];save();render();break;
  case 'short':var ss=S.wo[date]||(S.wo[date]=wsess(date,pickDay));ss.short=!ss.short;save();render();break;
  case 'adj':
    var sr=setRef(el.dataset.ex,+el.dataset.i),kk=el.dataset.k,base=sr[kk]===''||sr[kk]==null?0:+sr[kk];
    sr[kk]=Math.max(0,base+ +el.dataset.d);
    var i2=+el.dataset.i,arr=S.wo[date].sets[el.dataset.ex];
    if(kk==='w')for(var j=i2+1;j<arr.length+3;j++){var nx=arr[j];if(nx&&!nx.done)nx.w=sr.w}
    save();render();break;
  case 'ck':
    var s2=setRef(el.dataset.ex,+el.dataset.i);
    var inp=document.querySelectorAll('input[data-ex="'+el.dataset.ex+'"][data-i="'+el.dataset.i+'"]');
    inp.forEach(function(x){if(x.value!=='')s2[x.dataset.k]=+x.value});
    s2.done=!s2.done;save();render();
    if(s2.done)startTimer();else stopTimer();break;
  case 'finish':
    var s3=S.wo[date]||(S.wo[date]=wsess(date,pickDay));s3.done=!s3.done;save();stopTimer();render();
    if(s3.done){var n=0;Object.keys(s3.sets||{}).forEach(function(x){n+=(s3.sets[x]||[]).filter(function(z){return z&&z.done}).length});toast('Workout saved · '+n+' sets')}
    break;
  case 't30':if(timer){timer.end+=30000;tick()}break;
  case 'tskip':stopTimer();break;
  case 'savew':var w=nv('wt');if(!w){toast('Enter your weight');return}if(S.exampleWeights){S.weights={};delete S.exampleWeights}S.weights[today()]=w;save();render();toast('Weight saved');break;
  case 'ssave':var k2=nv('s-kcal'),p2=nv('s-p'),f3=nv('s-f'),rs=nv('s-rest');if(k2>800)S.targets.kcal=k2;if(p2>0)S.targets.p=p2;if(f3>0)S.targets.f=f3;if(rs>=15)S.rest=rs;save();toast('Targets saved');break;
  case 'lvl':S.level=el.dataset.l;save();openSettings();break;
  case 'exp':var ta=$('#bk');ta.value=JSON.stringify(S);ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Backup copied')},function(){toast('Text selected. Copy it now.')})}catch(x){toast('Text selected. Copy it now.')}break;
  case 'imp':var txt=($('#bk').value||'').trim();if(!txt){toast('Paste a backup first');return}
    if(!armed){armed=true;openSettings();$('#bk').value=txt;return}
    try{var o=JSON.parse(txt);if(!o.targets||!o.log)throw 0;S=Object.assign(def(),o);save();armed=false;$('#sheet').hidden=true;render();toast('Backup restored')}catch(x){armed=false;openSettings();toast('That is not a valid backup')}break;
  case 'undo':if(undo){var u=undo;undo=null;u();$('#toast').hidden=true}break;
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.a==='setin'){var sr=setRef(el.dataset.ex,+el.dataset.i);sr[el.dataset.k]=el.value===''?'':+el.value;save()}
});
document.addEventListener('input',function(ev){if(ev.target.id==='sq'){sq=ev.target.value;fillSearch()}else if(ev.target.id==='est'){estText=ev.target.value;estTouched=false;updEst()}else if(ev.target.id==='estk'||ev.target.id==='estp'){estTouched=true}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='est'){ev.preventDefault();var b=document.querySelector('[data-a=estadd]');if(b)b.click()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&timer)tick()});
render();
})();
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
